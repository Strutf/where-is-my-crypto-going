[project]
name = "where-is-my-crypto-going"
version = "0.1.0"
description = "Previsão experimental da direção do Bitcoin e das notícias por trás dos grandes movimentos."
authors = [{ name = "Victor Miranda Florido" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.25"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wimcg = "wimcg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wimcg"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
