[project]
name = "where-is-my-crypto-going"
version = "0.1.0"
description = "Previsão experimental da direção do Bitcoin e das notícias por trás dos grandes movimentos."
authors = [{ name = "Victor Miranda Florido" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# A API usa só httpx + fastapi; ficam no núcleo para que qualquer instalador
# (requirements.txt ou pyproject, como na Vercel) consiga subi-la. O pandas e o pyarrow, que
# são pesados e só servem à coleta, ficam no extra "pipeline".
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
]

[project.optional-dependencies]
pipeline = [
    "pandas>=2.2",
    "pyarrow>=16",
]
hf = ["huggingface_hub>=0.25"]
s3 = ["boto3>=1.34"]
api = ["uvicorn>=0.30"]
# Modelos publicados (treino mensal e previsões no Actions): gradient boosting do scikit-learn.
ml = [
    "where-is-my-crypto-going[pipeline]",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]
# Redes neurais, só para a pesquisa local (o PyTorch tem perto de 1 GB).
nn = ["torch>=2.5"]
dev = [
    "where-is-my-crypto-going[pipeline,api]",
    # Os testes do treino usam o scikit-learn; o PyTorch (pesado) não é necessário para eles.
    "scikit-learn>=1.5",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
wimcg = "wimcg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wimcg"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
