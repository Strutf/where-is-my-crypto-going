<main style="display:grid;gap:36px">
  <section class="section">
    <header>
      <h1>{{t:fc.title}}</h1>
      <p>{{t:fc.intro}}</p>
      <p class="note">{{t:fc.caveat}}</p>
    </header>
  </section>

  <section class="section" aria-labelledby="now-h">
    <header><h2 id="now-h">{{t:fc.now_title}}</h2><p class="note" id="issued"></p></header>
    <div class="cards" id="cards"><div class="empty">{{t:home.loading}}</div></div>
  </section>

  <section class="section" aria-labelledby="cmp-h">
    <header>
      <h2 id="cmp-h">{{t:fc.cmp_title}}</h2>
      <p class="note" id="cmp-note"></p>
    </header>
    <div class="btns">
      <span class="btns" role="group" aria-label="{{t:fc.view_label}}">
        <button class="btn" type="button" data-view="ret" aria-pressed="true">{{t:fc.v_ret}}</button>
        <button class="btn" type="button" data-view="vol" aria-pressed="false">{{t:fc.v_vol}}</button>
        <button class="btn" type="button" data-view="acc" aria-pressed="false">{{t:fc.v_acc}}</button>
      </span>
      <span class="btns" role="group" aria-label="{{t:fc.horizon_label}}">
        <button class="btn" type="button" data-ch="1" aria-pressed="true">1 h</button>
        <button class="btn" type="button" data-ch="4" aria-pressed="false">4 h</button>
        <button class="btn" type="button" data-ch="24" aria-pressed="false">24 h</button>
      </span>
    </div>
    <div class="plot px inset" id="plot">
      <canvas aria-label="{{t:fc.cmp_aria}}"></canvas>
      <div class="tip px" hidden></div>
      <div class="msg" id="plot-msg">{{t:home.loading}}</div>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="section" aria-labelledby="score-h">
    <header>
      <h2 id="score-h">{{t:fc.score_title}}</h2>
      <p class="note">{{t:fc.score_note}}</p>
    </header>
    <div class="btns" role="group" aria-label="{{t:fc.window_label}}">
      <button class="btn" type="button" data-win="7d" aria-pressed="false">{{t:fc.w7}}</button>
      <button class="btn" type="button" data-win="30d" aria-pressed="false">{{t:fc.w30}}</button>
      <button class="btn" type="button" data-win="all" aria-pressed="true">{{t:fc.wall}}</button>
    </div>
    <div class="tbl px inset"><table id="score"></table></div>
    <p class="note" id="score-foot"></p>
  </section>

  <section class="section" aria-labelledby="log-h">
    <header>
      <h2 id="log-h">{{t:fc.log_title}}</h2>
      <p class="note">{{t:fc.log_note}}</p>
    </header>
    <div class="btns" role="group" aria-label="{{t:fc.horizon_label}}">
      <button class="btn" type="button" data-h="0" aria-pressed="true">{{t:fc.h_all}}</button>
      <button class="btn" type="button" data-h="1" aria-pressed="false">1 h</button>
      <button class="btn" type="button" data-h="4" aria-pressed="false">4 h</button>
      <button class="btn" type="button" data-h="24" aria-pressed="false">24 h</button>
    </div>
    <div class="tbl px inset"><table id="log"></table></div>
  </section>

  <section class="section" aria-labelledby="bt-h">
    <header>
      <h2 id="bt-h">{{t:fc.bt_title}}</h2>
      <p class="note" id="bt-note">{{t:fc.bt_note}}</p>
    </header>
    <div class="tbl px inset"><table id="bt"></table></div>
  </section>
</main>
<script>
(() => {
  const { t, getJson, fmtUSD, fmtPct, fmtTime, icon, forecastCards } = WIMCG;
  const pct = (v) => (v * 100).toFixed(1) + "%";
  const best = (vals, higher = true) => { const m = higher ? Math.max(...vals) : Math.min(...vals); return vals.map((v) => v === m); };

  getJson("/v1/datasets/predictions/latest").then(({ data }) => {
    data.sort((a, b) => a.horizon_hours - b.horizon_hours);
    document.getElementById("cards").innerHTML = forecastCards(data);
    document.getElementById("issued").textContent = t("issued_at").replace("{time}", fmtTime(data[0].time)).replace("{model}", data[0].model_version);
  }).catch(() => { document.getElementById("cards").innerHTML = `<div class="empty">${t("no_forecast")}</div>`; });

  // Placar: o modelo e as referências nas mesmas previsões.
  let summary = null;
  function renderScore(win) {
    document.querySelectorAll("[data-win]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.win === win));
    const rows = summary.windows[win] || [];
    const head = `<tr><th>${t("horizon")}</th><th class="r">${t("checked")}</th><th class="r">${t("model_hits")}</th><th class="r">${t("always_up")}</th><th class="r">${t("opposite")}</th><th class="r">${t("swing_err_model")}</th><th class="r">${t("swing_err_naive")}</th></tr>`;
    const body = rows.map((r) => {
      const [a, b, c] = best([r.accuracy, r.always_up_accuracy, r.reversal_accuracy]);
      const [v1, v2] = best([r.volatility_mae_pct, r.volatility_mae_persistence_pct], false);
      const mark = (on, txt) => on ? `<b style="color:var(--accent);font-weight:400">${txt}</b>` : txt;
      return `<tr><td>${r.horizon_hours} h</td><td class="r">${r.n}</td><td class="r">${mark(a, pct(r.accuracy))}</td><td class="r">${mark(b, pct(r.always_up_accuracy))}</td><td class="r">${mark(c, pct(r.reversal_accuracy))}</td>
        <td class="r">${mark(v1, r.volatility_mae_pct.toFixed(2) + " pp")}</td><td class="r">${mark(v2, r.volatility_mae_persistence_pct.toFixed(2) + " pp")}</td></tr>`;
    }).join("");
    document.getElementById("score").innerHTML = head + (body || `<tr><td colspan="7" class="empty">${t("nothing_checked")}</td></tr>`);
    const n = Math.min(...rows.map((r) => r.n), Infinity);
    document.getElementById("score-foot").textContent = (n < 500 ? t("too_few") + " " : "") + t("since").replace("{time}", summary.since ? fmtTime(summary.since, { dateOnly: true, year: true }) : "—");
  }
  getJson("/v1/verification/summary").then((s) => { summary = s; renderScore("all"); })
    .catch(() => { document.getElementById("score").innerHTML = `<tr><td class="empty">${t("nothing_checked")}</td></tr>`; });
  document.querySelectorAll("[data-win]").forEach((b) => b.addEventListener("click", () => summary && renderScore(b.dataset.win)));

  // Registro: cada previsão conferida, da mais recente para a mais antiga.
  let log = [];
  function renderLog(h) {
    document.querySelectorAll("[data-h]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.h === String(h)));
    const rows = log.filter((r) => !h || r.horizon_hours === h).slice(0, 96);
    const head = `<tr><th>${t("issued")}</th><th>${t("horizon")}</th><th>${t("said")}</th><th class="r">${t("up_chance")}</th><th>${t("happened")}</th><th>${t("result")}</th><th class="r">${t("swing_pred_obs")}</th></tr>`;
    const body = rows.map((r) => {
      const said = `<span class="res ${r.direction}">${icon(r.direction, 2)} ${t(r.direction)}</span>`;
      // Previsão ainda sem resultado: aparece já, marcada como aguardando.
      const obs = r.pending ? `<span class="wait">${t("result_at")} ${fmtTime(r.target_time)}</span>`
        : `<span class="res ${r.observed_direction}">${icon(r.observed_direction, 2)} ${fmtPct(r.observed_return_pct)}</span>`;
      const res = r.pending ? `<span class="res wait">${icon("clock", 2)} ${t("waiting")}</span>`
        : r.hit ? `<span class="res up">${icon("check", 2)} ${t("hit")}</span>` : `<span class="res down">${icon("cross", 2)} ${t("miss")}</span>`;
      const swing = `${r.pred_volatility_pct.toFixed(2)}% / ${r.pending ? "—" : r.observed_volatility_pct.toFixed(2) + "%"}`;
      return `<tr><td>${fmtTime(r.time)}</td><td>${r.horizon_hours} h</td><td>${said}</td><td class="r">${pct(r.prob_up)}</td><td>${obs}</td><td>${res}</td>
        <td class="r">${swing}</td></tr>`;
    }).join("");
    document.getElementById("log").innerHTML = head + (body || `<tr><td colspan="7" class="empty">${t("nothing_checked")}</td></tr>`);
  }
  // Previsto contra real: barras = o que aconteceu; marcadores = o modelo e a referência.
  const plot = new WIMCG.ForecastPlot(document.getElementById("plot"));
  const plotMsg = document.getElementById("plot-msg");
  let all = [], pending = [], view = "ret", ch = 1;
  const DAY7 = 7 * 86400e3;
  const swatch = (color, kind) => `<span class="sw ${kind}" style="--c:var(--${color})"></span>`;
  function renderPlot() {
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === view));
    document.querySelectorAll("[data-ch]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.ch === String(ch)));
    document.getElementById("cmp-note").textContent = t("cmp_note_" + view);
    const cutoff = new Date(Date.now() - DAY7).toISOString();
    // Retorno e oscilação: as conferidas dos últimos 7 dias e, no fim, as que ainda aguardam
    // resultado (só o traço do previsto). Acerto: só as conferidas, desde o início.
    let rows = all.filter((r) => r.horizon_hours === ch);
    if (view !== "acc") rows = rows.filter((r) => r.time >= cutoff).concat(pending.filter((r) => r.horizon_hours === ch)).sort((a, b) => (a.time < b.time ? -1 : 1));
    if (!rows.length) { plotMsg.hidden = false; plotMsg.textContent = t("nothing_checked"); return; }
    plotMsg.hidden = true;
    const times = rows.map((r) => r.time);
    const legend = document.getElementById("legend");
    const waitTip = (r) => `<br><span class="wait">${t("waiting_until").replace("{time}", fmtTime(r.target_time))}</span>`;
    const waitLegend = rows.some((r) => r.pending) ? `<span>${swatch("muted", "wait")} ${t("legend_waiting")}</span>` : "";
    if (view === "ret") {
      plot.set({
        n: rows.length, times, zero: true, fmt: (v) => fmtPct(v), pending: rows.map((r) => !!r.pending),
        bars: rows.map((r) => (r.pending ? null : { v: r.observed_return_pct, color: r.observed_return_pct > 0 ? "up" : "down" })),
        marks: rows.map((r) => [{ v: r.pred_return_pct, color: "ink" }]),
        tip: (i) => { const r = rows[i]; return `${fmtTime(r.time)} UTC · ${ch} h<br>${t("said")}: ${t(r.direction)} (${pct(r.prob_up)})<br>${t("model_return")}: ${fmtPct(r.pred_return_pct)}` + (r.pending ? waitTip(r) : `<br>${t("real_return")}: ${fmtPct(r.observed_return_pct)}<br>${t("miss_by")}: ${Math.abs(r.pred_return_pct - r.observed_return_pct).toFixed(2)} pp · ${r.hit ? t("hit") : t("miss")}`); },
      });
      legend.innerHTML = `<span>${swatch("up", "bar")}${swatch("down", "bar")} ${t("legend_real_return")}</span><span>${swatch("ink", "dash")} ${t("legend_model")}</span>${waitLegend}`;
    } else if (view === "vol") {
      plot.set({
        n: rows.length, times, zero: true, fmt: (v) => v.toFixed(2) + "%", pending: rows.map((r) => !!r.pending),
        bars: rows.map((r) => (r.pending ? null : { v: r.observed_volatility_pct, color: "frost" })),
        marks: rows.map((r) => [{ v: r.persistence_volatility_pct, color: "muted", muted: true }, { v: r.pred_volatility_pct, color: "ink" }]),
        tip: (i) => { const r = rows[i]; return `${fmtTime(r.time)} UTC · ${ch} h<br>${t("model_swing")}: ${r.pred_volatility_pct.toFixed(2)}%<br>${t("repeat_swing")}: ${r.persistence_volatility_pct.toFixed(2)}%` + (r.pending ? waitTip(r) : `<br>${t("real_swing")}: ${r.observed_volatility_pct.toFixed(2)}%<br>${t("miss_by")}: ${Math.abs(r.pred_volatility_pct - r.observed_volatility_pct).toFixed(2)} pp (${t("repeat_swing").toLowerCase()}: ${Math.abs(r.persistence_volatility_pct - r.observed_volatility_pct).toFixed(2)} pp)`); },
      });
      legend.innerHTML = `<span>${swatch("frost", "bar")} ${t("legend_real_swing")}</span><span>${swatch("ink", "dash")} ${t("legend_model")}</span><span>${swatch("muted", "dash2")} ${t("legend_repeat")}</span>${waitLegend}`;
    } else {
      if (!rows.length) { plotMsg.hidden = false; plotMsg.textContent = t("nothing_checked"); return; }
      // Acerto acumulado desde o início, do modelo e das duas regras sem modelo.
      const cum = (key) => { let k = 0; return rows.map((r, i) => (k += r[key] ? 1 : 0, (k / (i + 1)) * 100)); };
      const lines = [{ values: cum("always_up_hit"), color: "frost", width: 2 }, { values: cum("reversal_hit"), color: "muted", width: 2, dashed: true }, { values: cum("hit"), color: "accent", width: 3 }];
      plot.set({
        n: rows.length, times, range: [0, 100], ref: 50, fmt: (v) => v.toFixed(0) + "%", lines,
        tip: (i) => `${t("after_n").replace("{n}", i + 1)}<br>${t("model_hits")}: ${lines[2].values[i].toFixed(1)}%<br>${t("always_up")}: ${lines[0].values[i].toFixed(1)}%<br>${t("opposite")}: ${lines[1].values[i].toFixed(1)}%`,
      });
      legend.innerHTML = `<span>${swatch("accent", "line")} ${t("legend_model")}</span><span>${swatch("frost", "line")} ${t("always_up")}</span><span>${swatch("muted", "dline")} ${t("opposite")}</span><span>${swatch("muted", "dline")} 50% = ${t("coin_flip")}</span>`;
    }
  }
  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => { view = b.dataset.view; renderPlot(); }));
  document.querySelectorAll("[data-ch]").forEach((b) => b.addEventListener("click", () => { ch = Number(b.dataset.ch); renderPlot(); }));

  // Conferidas de até 90 dias (gráfico, acerto acumulado e tabela) e previsões dos últimos 7 dias,
  // para mostrar já as que ainda aguardam resultado.
  const end = new Date(Math.ceil(Date.now() / 3600e3) * 3600e3);
  const iso = (d) => d.toISOString().slice(0, 13) + ":00";
  Promise.all([
    getJson(`/v1/datasets/verification/data?start=${iso(new Date(end - 90 * 86400e3))}&end=${iso(end)}`),
    getJson(`/v1/datasets/predictions/data?start=${iso(new Date(end - DAY7))}&end=${iso(end)}`).catch(() => ({ data: [] })),
  ])
    .then(([ver, pred]) => {
      all = ver.data.sort((a, b) => (a.time < b.time ? -1 : 1));
      const done = new Set(all.map((r) => r.time + "|" + r.horizon_hours));
      pending = pred.data.filter((r) => !done.has(r.time + "|" + r.horizon_hours)).map((r) => ({ ...r, pending: true }));
      const cutoff = new Date(Date.now() - DAY7).toISOString();
      log = all.filter((r) => r.time >= cutoff).concat(pending).sort((a, b) => (a.time < b.time ? 1 : a.time > b.time ? -1 : a.horizon_hours - b.horizon_hours));
      renderLog(0); renderPlot();
    })
    .catch(() => {
      document.getElementById("log").innerHTML = `<tr><td class="empty">${t("load_error")}</td></tr>`;
      plotMsg.textContent = t("load_error");
    });
  document.querySelectorAll("[data-h]").forEach((b) => b.addEventListener("click", () => renderLog(Number(b.dataset.h))));

  // Teste no passado (avaliação mês a mês do modelo publicado).
  getJson("/v1/models/current").then((m) => {
    const ev = m.evaluation;
    const head = `<tr><th>${t("horizon")}</th><th class="r">${t("model_hits")}</th><th class="r">${t("always_up")}</th><th class="r">${t("opposite")}</th><th class="r">${t("swing_err_model")}</th><th class="r">${t("swing_err_har")}</th><th class="r">${t("swing_err_naive")}</th></tr>`;
    const body = Object.keys(ev.direction).map((h) => {
      const d = ev.direction[h], v = ev.volatility[h];
      return `<tr><td>${h} h</td><td class="r">${pct(d.accuracy)}</td><td class="r">${pct(d.always_up)}</td><td class="r">${pct(d.reversal)}</td>
        <td class="r">${v.gb_mae.toFixed(2)} pp</td><td class="r">${v.har_mae.toFixed(2)} pp</td><td class="r">${v.persistence_mae.toFixed(2)} pp</td></tr>`;
    }).join("");
    document.getElementById("bt").innerHTML = head + body;
    document.getElementById("bt-note").textContent = t("bt_period").replace("{from}", ev.period[0]).replace("{to}", ev.period[1]).replace("{model}", m.model_version);
  }).catch(() => { document.getElementById("bt").innerHTML = `<tr><td class="empty">${t("load_error")}</td></tr>`; });
})();
</script>
