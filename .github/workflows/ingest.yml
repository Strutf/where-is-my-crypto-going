name: ingest

# Coleta a cada 15 minutos (preço de 1 min e Fear & Greed) e atualiza os grandes movimentos.
# Como no Future Space, o disparo principal pode vir de fora (cron-job.org chamando
# workflow_dispatch); o on.schedule fica como reserva.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Opcional: dataset para carregar o histórico (btc-usd-1m, fear-greed ou gkg-hourly). Se preenchido, roda só isso. Com gkg-history, importa history/gkg-hourly.parquet (BigQuery) e ignora as datas."
        type: string
        default: ""
      desde:
        description: "Data inicial do histórico (ex.: 2015-07-20)"
        type: string
        default: "2015-07-20"
      ate:
        description: "Opcional: data final do histórico (ex.: 2017-01-01). Vazio = agora."
        type: string
        default: ""

# O GITHUB_TOKEN deste workflow só pode ler o repositório.
permissions:
  contents: read

# Só um job grava no Hugging Face por vez.
concurrency:
  group: hf-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A coleta normal leva ~2 min; o limite maior é para as cargas históricas.
    timeout-minutes: 300
    env:
      FS_STORAGE: hf
      FS_HF_REPO: ${{ vars.FS_HF_REPO }}
    steps:
      - name: Verificar configuração
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ok=true
          if [ -z "$FS_HF_REPO" ]; then
            echo "::error::Variável FS_HF_REPO ausente (Settings > Secrets and variables > Actions > Variables)."
            ok=false
          fi
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Secret HF_TOKEN ausente (Settings > Secrets and variables > Actions > Secrets)."
            ok=false
          fi
          $ok
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # Instalação sem o token no ambiente: código de terceiros não consegue lê-lo.
      - run: pip install -c requirements-pipeline.txt ".[pipeline,hf]"
      - name: Coletar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BACKFILL: ${{ inputs.backfill }}
          DESDE: ${{ inputs.desde }}
          ATE: ${{ inputs.ate }}
        run: |
          if [ "$BACKFILL" = "gkg-history" ]; then
            wimcg gkg-import history/gkg-hourly.parquet
          elif [ -n "$BACKFILL" ]; then
            wimcg backfill "$BACKFILL" --start "$DESDE" ${ATE:+--end "$ATE"}
          else
            wimcg update
          fi
      - name: Atualizar derivados (velas de 1 hora, grandes movimentos, estado do mercado)
        if: ${{ !cancelled() }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BACKFILL: ${{ inputs.backfill }}
        # Depois de uma carga histórica de velas, recalcula tudo; no dia a dia, só o período recente.
        run: |
          if [ "$BACKFILL" = "btc-usd-1m" ]; then
            wimcg derive --full
          else
            wimcg derive
          fi
      # A busca do GDELT recusa a maioria das consultas vindas do Actions (IPs compartilhados),
      # por isso vai aos poucos: um movimento por execução, parando na primeira recusa.
      - name: Notícias dos grandes movimentos (aos poucos)
        if: ${{ !cancelled() && inputs.backfill == '' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: wimcg news --limit 1 --quick
