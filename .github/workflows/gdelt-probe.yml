name: gdelt-probe

# Teste da DOC 2.0 API do GDELT a partir dos servidores do GitHub Actions, antes de depender
# dela para a carga histórica e a coleta ao vivo das notícias (ver docs/contexto.md).
# Faz consultas de série temporal (volume e tom por hora, uma semana por consulta) no mesmo
# ritmo da carga real e resume quantas passaram e quantas foram recusadas (429).
on:
  workflow_dispatch:
    inputs:
      consultas:
        description: "Número de consultas"
        type: string
        default: "20"
      intervalo:
        description: "Segundos entre consultas"
        type: string
        default: "8"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -c requirements-pipeline.txt httpx
      - name: Consultar o GDELT
        env:
          N: ${{ inputs.consultas }}
          INTERVAL: ${{ inputs.intervalo }}
        shell: python
        run: |
          import collections, json, os, time
          from datetime import datetime, timedelta
          import httpx

          URL = "https://api.gdeltproject.org/api/v2/doc/doc"
          QUERY = "(bitcoin OR cryptocurrency OR crypto) sourcelang:english"
          n, interval = int(os.environ["N"]), float(os.environ["INTERVAL"])
          week0 = datetime(2018, 1, 1)
          counts, lines = collections.Counter(), []
          with httpx.Client(timeout=90, headers={"User-Agent": "research-client"}) as c:
              for i in range(n):
                  if i:
                      time.sleep(interval)
                  mode = "timelinevolraw" if i % 2 == 0 else "timelinetone"
                  start = week0 + timedelta(weeks=i // 2 * 26)  # semanas espalhadas de 2018 a 2026
                  params = {"query": QUERY, "mode": mode, "format": "json",
                            "startdatetime": f"{start:%Y%m%d%H%M%S}",
                            "enddatetime": f"{start + timedelta(weeks=1):%Y%m%d%H%M%S}"}
                  t0 = time.monotonic()
                  try:
                      r = c.get(URL, params=params)
                      text = r.text.strip()
                      if text.startswith("{"):
                          series = json.loads(text).get("timeline", [])
                          points = len(series[0]["data"]) if series else 0
                          result = f"ok ({points} pontos)"
                          counts["ok"] += 1
                      else:
                          result = f"HTTP {r.status_code}: {text[:80]}"
                          counts["429" if r.status_code == 429 else "outro"] += 1
                  except httpx.HTTPError as exc:
                      result = f"erro de conexão: {exc}"
                      counts["conexão"] += 1
                  line = f"{i + 1:>3} {mode:<15} {start:%Y-%m-%d} {time.monotonic() - t0:5.1f}s  {result}"
                  print(line, flush=True)
                  lines.append(line)
          summary = ", ".join(f"{k}: {v}" for k, v in sorted(counts.items()))
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## GDELT dos servidores do GitHub\n\n**{summary}**\n\n```\n" + "\n".join(lines) + "\n```\n")
